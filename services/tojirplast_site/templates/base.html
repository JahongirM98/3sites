<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Tojir Plast{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% load static %}

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>

<body class="bg-white text-gray-900">

<!-- HEADER -->
<header class="border-b bg-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

        <!-- LOGO -->
        <a href="/" class="flex items-center gap-2">
            <img src="{% static 'images/logo_without.png' %}" class="h-10">
            <span class="text-xl font-bold text-[#003a70]">Tojir Plast</span>
        </a>

        <!-- NAV -->
        <nav class="hidden md:flex gap-6 text-sm font-medium">
            <a href="/" class="text-blue-600">Главная</a>
            <a href="/catalog/">Каталог</a>
            <a href="/about/">О нас</a>
            <a href="/contacts/">Контакты</a>
        </nav>

    </div>
</header>

<!-- CONTENT -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="border-t bg-gray-50 mt-20">
    <div class="max-w-7xl mx-auto px-4 py-10 text-center">

        <h5 class="font-bold text-lg mb-4">Tojir Plast</h5>

        <div class="flex justify-center gap-6 text-sm text-gray-500 mb-4">
            <a href="/">Главная</a>
            <a href="/catalog/">Каталог</a>
            <a href="/about/">О нас</a>
            <a href="/contacts/">Контакты</a>
        </div>

        <p class="text-gray-400 text-sm">
            © 2026 Tojir Plast. Все права защищены.
        </p>

    </div>
</footer>

</body>
</html>
